specVersion: 1.0.0
description: xmrp2p — atomic ETH/XMR swap offer book
repository: https://github.com/v3xlabs/xmrp2p
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: XMRP2P
    # The fixed contract on Sepolia — every event in the ABI is live here.
    # The upstream mainnet v1.1 deployment (0xad6871d4…) has real offers but
    # predates Withdrawal / Recovered / PayoutCredited / ParametersUpdated, so
    # four of the five handlers would never fire against it.
    network: sepolia
    source:
      address: "0x67DB37c3be37B44c0506e5DF441437C83114bCd2"
      abi: XMRP2P
      # Deployment block. ParametersUpdated fires in this very block from the
      # constructor, so MarketParameters is populated from the first block synced.
      startBlock: 11670176
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities:
        - Offer
        - OfferTransition
        - Account
        - PayoutCredit
        - AccountWithdrawal
        - OwnerRecovery
        - MarketParameters
      abis:
        - name: XMRP2P
          file: ./abis/XMRP2P.json
      eventHandlers:
        - event: OfferEvent(indexed uint256,indexed uint8,indexed uint8)
          handler: handleOfferEvent
        - event: PayoutCredited(indexed address,uint256)
          handler: handlePayoutCredited
        - event: Withdrawal(indexed address,uint256)
          handler: handleWithdrawal
        - event: Recovered(indexed address,uint256)
          handler: handleRecovered
        - event: ParametersUpdated((uint256,uint256,uint256,uint256,uint256,uint256))
          handler: handleParametersUpdated
