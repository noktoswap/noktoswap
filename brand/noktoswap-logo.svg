<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0B1230"/>
      <stop offset="0.55" stop-color="#17265A"/>
      <stop offset="1" stop-color="#090F24"/>
    </linearGradient>

    <linearGradient id="moon" x1="110" y1="100" x2="250" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2F7FF"/>
      <stop offset="0.45" stop-color="#C6D8F5"/>
      <stop offset="1" stop-color="#7F9AD4"/>
    </linearGradient>

    <linearGradient id="ethTop" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#DCEBFF"/>
      <stop offset="1" stop-color="#8FBCFF"/>
    </linearGradient>
    <linearGradient id="ethBot" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#9EC4FF"/>
      <stop offset="1" stop-color="#5E93F7"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#6FA8FF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A9C4FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#A9C4FF" stop-opacity="0"/>
    </radialGradient>

    <mask id="crescent">
      <rect width="512" height="512" fill="black"/>
      <circle cx="240" cy="258" r="158" fill="white"/>
      <circle cx="330" cy="208" r="150" fill="black"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#night)"/>

  <!-- stars -->
  <g fill="#DCE8FF">
    <circle cx="112" cy="96" r="3.4" opacity="0.85"/>
    <circle cx="158" cy="58" r="2.1" opacity="0.5"/>
    <circle cx="402" cy="96" r="2.6" opacity="0.7"/>
    <circle cx="440" cy="168" r="1.9" opacity="0.45"/>
    <circle cx="424" cy="396" r="3.1" opacity="0.75"/>
    <circle cx="96" cy="424" r="2.2" opacity="0.5"/>
    <circle cx="70" cy="300" r="1.8" opacity="0.4"/>
  </g>

  <circle cx="240" cy="258" r="188" fill="url(#moonGlow)"/>
  <circle cx="334" cy="246" r="160" fill="url(#glow)"/>

  <!-- crescent moon -->
  <rect width="512" height="512" fill="url(#moon)" mask="url(#crescent)"/>

  <!-- ethereum mark, nestled in the crescent's hollow -->
  <g transform="translate(268.01 138.50) scale(0.51570)">
    <path d="M127.9611 0.0369453L125.1661 9.5V285.168L127.9611 287.958L255.9231 212.32L127.9611 0.0369453Z" fill="url(#ethTop)" opacity="0.74"/>
    <path d="M127.962 0.0369453L0 212.32L127.962 287.958V154.158V0.0369453Z" fill="url(#ethTop)"/>
    <path d="M127.9611 312.1866L126.3861 314.1066V412.3056L127.9611 416.9066L255.9991 236.5866L127.9611 312.1866Z" fill="url(#ethBot)" opacity="0.74"/>
    <path d="M127.962 416.9052V312.1852L0 236.5852L127.962 416.9052Z" fill="url(#ethBot)"/>
    <path d="M127.9611 287.9577L255.9211 212.3207L127.9611 154.1587V287.9577Z" fill="url(#ethBot)" opacity="0.6"/>
    <path d="M0.0009 212.3208L127.9609 287.9578V154.1588L0.0009 212.3208Z" fill="url(#ethTop)" opacity="0.8"/>
  </g>
